.ctrl-label{font-size:.73rem;font-weight:700;color:#555}

function descargas(e){

}

  OBS = c.obs.split(',').map(function(s){ return s === '' ? null : +s; });
  document.getElementById('h1').innerHTML = 'Proyecci&oacute;n de Volumen &ndash; Embalse ' +
    (EMB==='sisga' ? 'del Sisga' : EMB==='neusa' ? 'del Neusa' : EMB==='tomine' ? 'del Tomin&eacute;' : 'de Chuza');
  document.getElementById('sub').innerHTML =
    c.sis + ' &nbsp;|&nbsp; Proyecci&oacute;n al 31 dic ' + ANIO + ' desde el ' + fCorta(I_INI) +
    ' &middot; &Uacute;ltimos datos: ' + u[2] + ' ' + MNC[u[1]-1] + ' ' + u[0] + ' &middot; Millones de m&sup3;';
  document.getElementById('fuente').textContent =
    'Datos: reportes diarios de embalses CAR, hoja ' + c.hoja +
    (EMB==='chuza' ? ' · Descarga: EAAB' : ' · Descargas: comité hidrológico CAR (' + PRON.meta.fecha_comite + ') y tratamiento en Tibitoc (EAAB)') +
    ' · Señal: IDEAM, radicado 20263040120291 · Generado el ' + PRON.meta.generado;
  [chartP, chartF, chartI].forEach(function(ch){ if(ch) ch.destroy(); });
  chartP = chartF = chartI = null;
  CROSS = null; tt.style.display = 'none';
  controles();
  if(VISTA === 'P') buildP();
  if(VISTA === 'F') drawF();
  if(VISTA === 'I') drawI();
  if(VISTA === 'S') drawS();
}

// ===== Controles de operación =====
function controles(){
  var norte = EMB !== 'chuza';
  document.getElementById('rngChuza').style.display = norte ? 'none' : '';
  document.getElementById('rngTib').style.display = norte ? '' : 'none';
  document.getElementById('rngRio').style.display = norte ? '' : 'none';
  document.getElementById('qChuza').value = PAR.qChuza;
  document.getElementById('qTib').value = PAR.tibitoc;
  document.getElementById('qRio').value = PAR.rio;
  textoControles();
}

function textoControles(){
  document.getElementById('qChuzaV').textContent = PAR.qChuza.toFixed(1);
  document.getElementById('qTibV').textContent = PAR.tibitoc.toFixed(1);
  document.getElementById('qRioV').textContent = PAR.rio.toFixed(1);
  var el = document.getElementById('escNota');
  if(EMB === 'chuza'){ el.textContent = 'Planta + fondo, constante hasta diciembre'; return; }
  var tot = Math.max(0, PAR.tibitoc - PAR.rio), e = PRON.emb;
  el.textContent = 'Descarga nov–dic: Tominé ' + (e.tomine.desc.cuota*tot).toFixed(2) +
    ' · Neusa ' + (e.neusa.desc.cuota*tot).toFixed(2) + ' · Sisga ' + (e.sisga.desc.cuota*tot).toFixed(2) + ' m³/s';
}

['qChuza','qTib','qRio'].forEach(function(id){
  document.getElementById(id).addEventListener('input', function(ev){
    var v = parseFloat(ev.target.value);
    if(id === 'qChuza') PAR.qChuza = v; else if(id === 'qTib') PAR.tibitoc = v; else PAR.rio = v;
    textoControles();
    if(chartP) actualizarP();
  });
});
document.getElementById('btnReset').onclick = function(){ parDefecto(); controles(); if(chartP) actualizarP(); };
document.getElementById('zAnio').onclick = function(){ setZoom(false); };
document.getElementById('zPro').onclick = function(){ setZoom(true); };

function setZoom(z){
  ZOOM = z;
  document.getElementById('zAnio').classList.toggle('active', !z);
  document.getElementById('zPro').classList.toggle('active', z);

  CROSS = null; tt.style.display = 'none';

var CAPAS = [
  { txt:'Observado 2026',          ds:[6],   tipo:'solid',  color:C_OBS },
  { txt:'Proyección · mediana',    ds:[5],   tipo:'dashed', color:C_PRO },
  { txt:'Rango probable P10–P90',  ds:[0,1], tipo:'banda',  color:C_PRO },
  { txt:'Señal IDEAM',             ds:[4],   tipo:'dotted', color:C_IDE },
  { txt:'Curva guía',              ds:[3],   tipo:'dashed', color:C_GUIA },
  { txt:'Capacidad útil',          ds:[2],   tipo:'solid',  color:INK2 }
];

function puntosPro(arr){ return arr.map(function(v,k){ return { x:xDeDia(I_INI+k), y:v }; }); }
function puntosObs(){
  var out = [];
  OBS.forEach(function(v,i){ if(v !== null) out.push({ x:xDeDia(i), y:v }); });
  return out;
}

// Rótulos, inicio de la proyección y cruz de lectura, dibujados sobre las series.
var capasP = {
  id:'capasP',
  afterDatasetsDraw:function(chart){
    var c = cfg(), ctx = chart.ctx, ca = chart.chartArea, sx = chart.scales.x, sy = chart.scales.y;
    ctx.save();
    ctx.font = '600 10.5px Segoe UI, Arial';
    var x0 = sx.getPixelForValue(xDeDia(I_INI+1));
    if(x0 >= ca.left && x0 <= ca.right){
      ctx.strokeStyle = MUTED; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x0, ca.top); ctx.lineTo(x0, ca.bottom); ctx.stroke();
      ctx.fillStyle = INK2; ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
      ctx.fillText(fCorta(I_INI) + ' · inicio de la proyección', x0-5, ca.top-3);
    }
    if(chart.isDatasetVisible(2)){
      var yc = sy.getPixelForValue(c.cap);
      if(yc >= ca.top+12 && yc <= ca.bottom){
        ctx.fillStyle = INK2; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
        ctx.fillText('Capacidad útil · ' + c.cap.toFixed(1) + ' Mm³', ca.left+6, yc-3);
      }
    }
    if(chart.isDatasetVisible(5)){
      var n = SIM.p50.length-1, ye = sy.getPixelForValue(SIM.p50[n]);
      if(ye >= ca.top && ye <= ca.bottom){
        ctx.fillStyle = INK; ctx.font = '700 11px Segoe UI, Arial'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        ctx.fillText(SIM.p50[n].toFixed(0), sx.getPixelForValue(12)+6, ye);
      }
    }
    if(CROSS !== null){
      var xp = sx.getPixelForValue(xDeDia(CROSS));
      ctx.strokeStyle = INK2; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(xp, ca.top); ctx.lineTo(xp, ca.bottom); ctx.stroke();
      var pts = [], k = CROSS - I_INI;
      if(chart.isDatasetVisible(6) && OBS[CROSS] !== null) pts.push([OBS[CROSS], C_OBS]);
      if(k >= 0 && chart.isDatasetVisible(5)) pts.push([SIM.p50[k], C_PRO]);
      if(k >= 0 && chart.isDatasetVisible(4)) pts.push([SIM.ide[k], C_IDE]);
      pts.forEach(function(p){
        var yp = sy.getPixelForValue(p[0]);
        if(yp < ca.top || yp > ca.bottom) return;
        ctx.beginPath(); ctx.arc(xp, yp, 4, 0, 2*Math.PI);
        ctx.fillStyle = p[1]; ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();
      });
    }
    ctx.restore();
  }
};

  SIM = simular();
  var DS = [
    { label:'P10', data:puntosPro(SIM.p10), borderWidth:0, pointRadius:0, showLine:true, fill:false, order:9 },
    { label:'P90', data:puntosPro(SIM.p90), borderWidth:0, pointRadius:0, showLine:true,
      fill:'-1', backgroundColor:C_PRO_BANDA, order:9 },
    { label:'Capacidad útil', data:[{x:0,y:c.cap},{x:12,y:c.cap}], borderColor:INK2, borderWidth:1,
      pointRadius:0, showLine:true, fill:false, order:8 },
    { label:'Curva guía', data:GUIA[EMB] || [], borderColor:C_GUIA, borderWidth:1.5, borderDash:[8,4],
      pointRadius:0, tension:.4, showLine:true, fill:false, order:7 },
    { label:'Señal IDEAM', data:puntosPro(SIM.ide), borderColor:C_IDE, borderWidth:2.5, borderDash:[1,5],
      borderCapStyle:'round', pointRadius:0, showLine:true, fill:false, order:5 },
    { label:'Mediana', data:puntosPro(SIM.p50), borderColor:C_PRO, borderWidth:2, borderDash:[7,4],

  chartP = new Chart(document.getElementById('cp').getContext('2d'), {

      layout:{ padding:{ top:18, right:34 } },
      plugins:{ legend:{ display:false }, tooltip:{ enabled:false } },
      scales:{
        x:{
          type:'linear', min:0, max:12,
          ticks:{ stepSize:1, color:MUTED, callback:function(v){ var i=Math.round(v); return (Math.abs(v-i)<1e-6 && i<12) ? MN[i] : ''; } },
          grid:{ color:GRID }

        y:{
          min:0, max:c.ymax, ticks:{ stepSize:c.ystep, color:MUTED },

        }

function actualizarP(){
  SIM = simular();
  var d = chartP.data.datasets;
  d[0].data = puntosPro(SIM.p10);
  d[1].data = puntosPro(SIM.p90);
  d[4].data = puntosPro(SIM.ide);
  d[5].data = puntosPro(SIM.p50);
  aplicarZoom();
  chartP.update('none');
  textosP();
  if(CROSS !== null) ocultarCruz();
}

function pasoBonito(r){
  var p = [1,2,5,10,20,25,50,100,200];
  for(var i=0; i<p.length; i++) if(p[i] >= r) return p[i];
  return 500;
}

function aplicarZoom(){
  var c = cfg(), x = chartP.options.scales.x, y = chartP.options.scales.y;
  if(!ZOOM){ x.min = 0; y.min = 0; y.max = c.ymax; y.ticks.stepSize = c.ystep; return; }
  x.min = 7;
  var vals = [];
  for(var i=DOY0[7]; i<NDIAS; i++) if(OBS[i] !== null) vals.push(OBS[i]);
  vals = vals.concat(SIM.p10, SIM.p90, SIM.ide);
  var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  if(c.cap >= lo && c.cap <= hi + (hi-lo)*0.6) hi = Math.max(hi, c.cap);
  var pad = Math.max((hi-lo)*0.08, 1), paso = pasoBonito((hi-lo+2*pad)/6);
  y.min = Math.max(0, Math.floor((lo-pad)/paso)*paso);
  y.max = Math.ceil((hi+pad)/paso)*paso;
  y.ticks.stepSize = paso;
}

function aplicarVisibilidad(){
  CAPAS.forEach(function(k){ k.ds.forEach(function(i){ chartP.setDatasetVisibility(i, !OCULTAS[k.txt]); }); });
}

function chipsP(){
  var cont = document.getElementById('chipsP');
  cont.innerHTML = '';
  CAPAS.forEach(function(k){
    var ch = nodo('button', 'chip2' + (OCULTAS[k.txt] ? ' off' : ''));
    ch.type = 'button';
    ch.setAttribute('aria-pressed', OCULTAS[k.txt] ? 'false' : 'true');
    ch.appendChild(llave(k.tipo, k.color));
    ch.appendChild(document.createTextNode(k.txt));
    ch.onclick = function(){ OCULTAS[k.txt] = !OCULTAS[k.txt]; aplicarVisibilidad(); chartP.update('none'); chipsP(); };
    cont.appendChild(ch);
  });
}

function tile(cont, lbl, num, sub){

  t.appendChild(nodo('div','lbl',lbl)); t.appendChild(nodo('div','num',num)); t.appendChild(nodo('div','sub',sub));
  cont.appendChild(t);

function textosP(){
  var c = cfg(), n = SIM.p50.length-1, cap = c.cap;
  var pc = function(v){ return (100*v/cap).toFixed(0) + ' %'; };
  var st = document.getElementById('stats');
  st.innerHTML = '';
  tile(st, 'Volumen al 31 dic · mediana', SIM.p50[n].toFixed(0) + ' Mm³',
       pc(SIM.p50[n]) + ' de la capacidad útil (' + cap.toFixed(1) + ' Mm³)');
  tile(st, 'Rango probable al 31 dic · P10–P90', SIM.p10[n].toFixed(0) + ' – ' + SIM.p90[n].toFixed(0) + ' Mm³',
       pc(SIM.p10[n]) + ' – ' + pc(SIM.p90[n]));
  tile(st, 'Señal IDEAM al 31 dic', SIM.ide[n].toFixed(0) + ' Mm³',
       pc(SIM.ide[n]) + ' · emisión ' + etqMes(PRON.meta.emision));
  var u = c.ult, k = diaDeFecha(u[0],u[1],u[2]) - I_INI;
  if(k >= 1 && k <= n){
    var pos = u[3] > SIM.p90[k] ? 'por encima del rango' : u[3] < SIM.p10[k] ? 'por debajo del rango' : 'dentro del rango';
    tile(st, 'Último dato observado · ' + u[2] + ' ' + MNC[u[1]-1], u[3].toFixed(1) + ' Mm³',
         pos + ' proyectado (' + SIM.p10[k].toFixed(0) + ' – ' + SIM.p90[k].toFixed(0) + ')');
  } else {
    tile(st, 'Volumen de partida · ' + fCorta(I_INI), c.v0.toFixed(1) + ' Mm³', pc(c.v0) + ' de la capacidad útil');
  }

  var txt = 'Ensamble de <b>' + SIM.n + ' años análogos</b> (' + PRON.meta.analogos[0] + '–' + PRON.meta.analogos[1] +
    ', meses con al menos ' + PRON.meta.min_dias + ' días de dato)';
  if(SIM.vert) txt += ' &middot; vierte en <b>' + SIM.vert + ' de ' + SIM.n + '</b>';
  txt += EMB === 'chuza'
    ? ' &middot; Descarga <b>' + PAR.qChuza.toFixed(1) + ' m³/s</b> de sep a dic'
    : ' &middot; Descargas del comité CAR en sep–oct; en nov–dic, Tibitoc <b>' + PAR.tibitoc.toFixed(1) +
      '</b> menos río <b>' + PAR.rio.toFixed(1) + ' m³/s</b>';
  txt += ' &middot; Lo observado desde el ' + fCorta(I_INI) + ' no entra al cálculo: sirve para verificar.';
  document.getElementById('infoP').innerHTML = txt;

  var cont = document.getElementById('tablaP'), filas = [], kk = 0;
  cont.innerHTML = '';
  MESES_P.forEach(function(m,i){
    kk += dimM(ANIO,m) - (m === MES_INI ? DIA_INI : 0);
    var o = OBS[I_INI+kk];
    filas.push([dimM(ANIO,m) + ' ' + MNC[m], SIM.q[i].toFixed(2), SIM.p10[kk].toFixed(1), SIM.p50[kk].toFixed(1),
                SIM.p90[kk].toFixed(1), pc(SIM.p50[kk]), SIM.ide[kk].toFixed(1), o === null ? '—' : o.toFixed(1)]);
  });
  tabla(cont, ['Fin de mes','Descarga (m³/s)','P10 (Mm³)','Mediana (Mm³)','P90 (Mm³)','Mediana (% útil)','Señal IDEAM (Mm³)','Observado (Mm³)'], filas);
}

// ----- Cruz de lectura: ratón, tacto y teclado -----
function guiaEn(x){
  var g = GUIA[EMB];
  if(!g) return null;
  for(var i=0; i<g.length-1; i++){
    if(x >= g[i].x && x <= g[i+1].x) return g[i].y + (x-g[i].x)*(g[i+1].y-g[i].y)/(g[i+1].x-g[i].x);
  }
  return null;
}

function filaTT(tipo, color, valor, etiqueta){
  var r = nodo('div','tt-row'), k;
  if(tipo === 'banda'){ k = nodo('span','tt-sw'); k.style.background = 'rgba(235,104,52,0.55)'; }
  else { k = nodo('span','tt-key'); k.style.borderTopColor = color; k.style.borderTopStyle = tipo; }
  r.appendChild(k); r.appendChild(nodo('b', null, valor)); r.appendChild(nodo('span','tt-lbl',etiqueta));
  return r;
}

function mostrarTT(cx, cy){
  var c = cfg(), doy = CROSS, k = doy - I_INI;
  var vol = function(v){ return v.toFixed(1) + ' Mm³ · ' + (100*v/c.cap).toFixed(0) + ' %'; };
  tt.innerHTML = '';
  tt.appendChild(nodo('div','tt-t', fmtD(fechaDia(doy))));
  if(OBS[doy] !== null) tt.appendChild(filaTT('solid', C_OBS, vol(OBS[doy]), 'Observado'));
  if(k >= 0){
    tt.appendChild(filaTT('dashed', C_PRO, vol(SIM.p50[k]), 'Mediana'));
    tt.appendChild(filaTT('banda', C_PRO, SIM.p10[k].toFixed(1) + ' – ' + SIM.p90[k].toFixed(1) + ' Mm³', 'P10–P90'));
    tt.appendChild(filaTT('dotted', C_IDE, vol(SIM.ide[k]), 'Señal IDEAM'));
  }
  var g = guiaEn(xDeDia(doy));
  if(g !== null) tt.appendChild(filaTT('dashed', '#bdbdbd', '≈ ' + g.toFixed(0) + ' Mm³', 'Curva guía'));
  tt.style.display = 'block';
  var w = tt.offsetWidth, h = tt.offsetHeight, left = cx + 16, top = cy - h - 12;
  if(left + w > window.innerWidth - 8) left = cx - w - 16;
  if(top < 8) top = cy + 16;
  tt.style.left = left + 'px';
  tt.style.top = top + 'px';
}

function ocultarCruz(){
  CROSS = null; tt.style.display = 'none';
  if(chartP) chartP.draw();
}

function moverCruz(clientX, clientY){
  if(!chartP) return;
  var r = chartP.canvas.getBoundingClientRect(), px = clientX - r.left, ca = chartP.chartArea;
  if(px < ca.left || px > ca.right){ ocultarCruz(); return; }
  CROSS = diaDeX(chartP.scales.x.getValueForPixel(px));
  chartP.draw();
  mostrarTT(clientX, clientY);
}

(function(){
  var cv = document.getElementById('cp');
  cv.addEventListener('mousemove', function(ev){ moverCruz(ev.clientX, ev.clientY); });
  cv.addEventListener('mouseleave', ocultarCruz);
  cv.addEventListener('touchstart', function(ev){ var t = ev.touches[0]; moverCruz(t.clientX, t.clientY); }, { passive:true });
  cv.addEventListener('touchmove', function(ev){ var t = ev.touches[0]; moverCruz(t.clientX, t.clientY); }, { passive:true });
  cv.addEventListener('blur', ocultarCruz);
  cv.addEventListener('keydown', function(ev){
    if(!chartP) return;
    if(ev.key === 'Escape'){ ocultarCruz(); return; }
    if(ev.key !== 'ArrowRight' && ev.key !== 'ArrowLeft') return;
    ev.preventDefault();
    var u = cfg().ult, paso = ev.shiftKey ? 7 : 1;
    if(CROSS === null) CROSS = diaDeFecha(u[0],u[1],u[2]);
    CROSS += (ev.key === 'ArrowRight' ? paso : -paso);
    CROSS = Math.max(ZOOM ? DOY0[7] : 0, Math.min(NDIAS-1, CROSS));
    chartP.draw();
    var r = cv.getBoundingClientRect();
    mostrarTT(r.left + chartP.scales.x.getPixelForValue(xDeDia(CROSS)), r.top + chartP.chartArea.top + 40);
  });
})();

// ===== VISTA AFLUENCIAS =====
var bigotes = {
  id:'bigotes',
  afterDatasetsDraw:function(chart){
    var a = cfg().afl, sy = chart.scales.y, ctx = chart.ctx;
    ctx.save();
    if(chart.isDatasetVisible(0)){
      ctx.strokeStyle = INK2; ctx.lineWidth = 1.5;
      chart.getDatasetMeta(0).data.forEach(function(bar, i){
        if(a.p10[i] === null) return;
        var y1 = sy.getPixelForValue(a.p10[i]), y2 = sy.getPixelForValue(a.p90[i]);
        ctx.beginPath();
        ctx.moveTo(bar.x, y1); ctx.lineTo(bar.x, y2);
        ctx.moveTo(bar.x-4, y1); ctx.lineTo(bar.x+4, y1);
        ctx.moveTo(bar.x-4, y2); ctx.lineTo(bar.x+4, y2);
        ctx.stroke();
      });
    }
    var m1 = chart.getDatasetMeta(1);
    ctx.fillStyle = C_OBS; ctx.font = 'bold 11px Segoe UI, Arial'; ctx.textAlign = 'center';
    a.act.forEach(function(v, i){
      if(v === null || a.dias[i] >= a.dim[i] || !m1.data[i]) return;
      ctx.fillText('⦿', m1.data[i].x, Math.min(m1.data[i].y, m1.data[i].base) - 6);
    });
    ctx.restore();
  }
};

function drawF(){
  var c = cfg(), a = c.afl, rango = PRON.meta.analogos[0] + '–' + PRON.meta.analogos[1];
  if(chartF){ chartF.destroy(); chartF = null; }
  var senal = MN.map(function(_, i){
    var j = MESES_P.indexOf(i);
    return j < 0 || a.media[i] === null ? null : Math.round(a.media[i]*(1 + c.ideam.anom[j]/100)*100)/100;
  });
  var comite = MN.map(function(_, i){ return (c.comite && i >= 7 && i <= 9) ? c.comite.afl[i-7] : null; });
  var DS = [
    { label:'Media ' + rango, data:a.media, backgroundColor:C_MEDIA, borderRadius:4, borderSkipped:'start', maxBarThickness:24, order:3 },
    { label:String(ANIO), data:a.act, backgroundColor:C_OBS, borderRadius:4, borderSkipped:'start', maxBarThickness:24, order:2 },
    { type:'line', label:'Señal IDEAM', data:senal, showLine:false, pointStyle:'rectRot', pointRadius:7, pointHoverRadius:8,
      pointBackgroundColor:C_IDE, pointBorderColor:'#fff', pointBorderWidth:2, backgroundColor:C_IDE, borderColor:C_IDE, order:1 }
  ];
  if(c.comite){
    DS.push({ type:'line', label:'Comité CAR · afluencia 100 %', data:comite, showLine:false, pointStyle:'triangle',
      pointRadius:7, pointHoverRadius:8, pointBackgroundColor:C_COM, pointBorderColor:'#fff', pointBorderWidth:2,
      backgroundColor:C_COM, borderColor:C_COM, order:0 });
  }
  chartF = new Chart(document.getElementById('cf').getContext('2d'), {
    type:'bar', data:{ labels:MN, datasets:DS }, plugins:[bigotes],
    options:{
      responsive:true, maintainAspectRatio:false, animation:{ duration:250 },
      datasets:{ bar:{ categoryPercentage:.62, barPercentage:.86 } },
      interaction:{ mode:'index', intersect:false },
      plugins:{
        legend:{ display:false },
        tooltip:{
          filter:function(it){ return it.parsed.y !== null; },
          callbacks:{
            label:function(it){
              var i = it.dataIndex, v = it.parsed.y.toFixed(2) + ' m³/s';
              if(it.datasetIndex === 0 && a.p10[i] !== null) return v + '  media (P10 ' + a.p10[i].toFixed(2) + ' – P90 ' + a.p90[i].toFixed(2) + ', ' + a.n[i] + ' años)';
              if(it.datasetIndex === 1) return v + '  ' + ANIO + (a.dias[i] < a.dim[i] ? ' ★ prom. días 1–' + a.dias[i] : '');
              return v + '  ' + it.dataset.label;
            }
          }
        }
      },
      scales:{
        x:{ grid:{ display:false }, ticks:{ color:MUTED } },
        y:{ suggestedMin:extremo([a.p10], Math.min, 0),                       // los bigotes quedan dentro del eje
            suggestedMax:extremo([a.p90, a.act, a.media, senal, comite], Math.max, 0) * 1.04,
            ticks:{ color:MUTED }, grid:{ color:GRID },
            title:{ display:true, text:a.tit + ' (m³/s)', color:INK2, font:{ size:11 } } }
      }
    }
  });

  var leg = document.getElementById('legF');
  leg.innerHTML = '';
  itemLeyenda(leg, 'barra', C_MEDIA, 'Media ' + rango + ' · bigote: rango P10–P90');
  itemLeyenda(leg, 'barra', C_OBS, String(ANIO) + ' (⦿ mes parcial)');
  itemLeyenda(leg, 'diamante', C_IDE, 'Señal IDEAM: media × (1 + anomalía, emisión ' + etqMes(PRON.meta.emision) + ')');
  if(c.comite) itemLeyenda(leg, 'triangulo', C_COM, 'Comité CAR (' + PRON.meta.fecha_comite + '), afluencia 100 %');

  var parc = [];
  a.act.forEach(function(v, i){ if(v !== null && a.dias[i] < a.dim[i]) parc.push(MN[i] + ': prom. días 1–' + a.dias[i]); });
  document.getElementById('notaF').textContent =
    a.tit + ' media mensual en m³/s · ' +
    (EMB === 'chuza'
      ? 'Columna AFLUENCIA del reporte CAR (residuo del balance: incluye lluvia y evaporación sobre el embalse)'
      : 'Variación de volumen + descarga, del reporte CAR' + (EMB === 'tomine' ? '; incluye el bombeo desde el río Bogotá' : '')) +
    ' · Media con meses de al menos ' + PRON.meta.min_dias + ' días de dato' + (parc.length ? ' · ' + parc.join(' · ') : '');

  var cont = document.getElementById('tablaF'), filas = [];
  cont.innerHTML = '';
  MESES_P.forEach(function(m, j){
    filas.push([MN[m], a.media[m].toFixed(2), a.p10[m].toFixed(2), a.p90[m].toFixed(2), signo(c.ideam.anom[j]) + ' %',
                senal[m].toFixed(2), comite[m] === null ? '—' : comite[m].toFixed(2),
                a.act[m] === null ? '—' : a.act[m].toFixed(2) + (a.dias[m] < a.dim[m] ? ' (días 1–' + a.dias[m] + ')' : '')]);
  });
  tabla(cont, ['Mes','Media ' + rango,'P10','P90','Anomalía IDEAM','Señal IDEAM','Comité CAR',String(ANIO)], filas);
}

// ===== VISTA SEÑAL IDEAM =====
function drawI(){
  var c = cfg(), em = c.ideam.emis, obs = c.ideam.obs, ult = PRON.meta.emision;
  if(chartI){ chartI.destroy(); chartI = null; }
  var emisiones = Object.keys(em).sort(), meses = {};
  emisiones.forEach(function(k){ Object.keys(em[k]).forEach(function(m){ meses[m] = 1; }); });
  var labels = Object.keys(meses).sort();
  var DS = [];
  emisiones.forEach(function(k, i){
    var esUlt = (k === ult);
    var gris = 'rgba(82,81,78,' + (0.22 + 0.5*i/Math.max(1, emisiones.length-2)).toFixed(2) + ')';
    DS.push({
      label:'Emisión ' + etqMes(k), data:labels.map(function(m){ return em[k][m] !== undefined ? em[k][m] : null; }),
      borderColor: esUlt ? C_IDE : gris, backgroundColor: esUlt ? C_IDE : gris,
      borderWidth: esUlt ? 2.5 : 1.5, pointRadius: esUlt ? 4 : 0, pointHoverRadius: 5,
      pointBorderColor:'#fff', pointBorderWidth:2, tension:0, spanGaps:false, order: esUlt ? 1 : 2
    });
  });
  DS.push({
    label:'Observado (afluencia CAR)', data:labels.map(function(m){ return obs[m] !== undefined ? obs[m] : null; }),
    borderColor:C_OBS, backgroundColor:C_OBS, borderWidth:2, pointRadius:4, pointHoverRadius:5,
    pointBorderColor:'#fff', pointBorderWidth:2, tension:0, spanGaps:false, order:0
  });
  chartI = new Chart(document.getElementById('ci').getContext('2d'), {
    type:'line', data:{ labels:labels.map(etqMesCorta), datasets:DS },
    options:{
      responsive:true, maintainAspectRatio:false, animation:{ duration:250 },
      interaction:{ mode:'index', intersect:false },
      plugins:{
        legend:{ display:false },
        tooltip:{
          filter:function(it){ return it.parsed.y !== null; },
          callbacks:{ label:function(it){ return signo(it.parsed.y) + ' %  ' + it.dataset.label; } }
        }
      },
      scales:{
        x:{ grid:{ color:GRID }, ticks:{ color:MUTED } },
        y:{
          ticks:{ color:MUTED, callback:function(v){ return (v > 0 ? '+' : '') + v + ' %'; } },
          grid:{ color:function(ctx){ return ctx.tick && ctx.tick.value === 0 ? '#9e9d97' : GRID; } },
          title:{ display:true, text:'Anomalía respecto a la media (%)', color:INK2, font:{ size:11 } }
        }
      }
    }
  });

  var leg = document.getElementById('legI');
  leg.innerHTML = '';
  itemLeyenda(leg, 'solid', 'rgba(82,81,78,0.6)', 'Emisiones ' + etqMes(emisiones[0]) + ' a ' + etqMes(emisiones[emisiones.length-2]) + ' (más oscura, más reciente)');
  itemLeyenda(leg, 'solid', C_IDE, 'Emisión ' + etqMes(ult) + ' (usada en la proyección)');
  itemLeyenda(leg, 'solid', C_OBS, 'Observado: afluencia CAR frente a su media ' + PRON.meta.analogos[0] + '–' + PRON.meta.analogos[1]);
  document.getElementById('notaI').textContent =
    'IDEAM: anomalía de escorrentía del modelo DWB (lluvia CHIRPS, malla de 5.5 km) frente a su media 1991–2020; ' +
    'el IDEAM la entrega como señal de déficit o excedencia, no como magnitud (radicado 20263040120291, 14 jul 2026). ' +
    'Observado: afluencia del reporte CAR frente a la media ' + PRON.meta.analogos[0] + '–' + PRON.meta.analogos[1] +
    ', sólo meses con al menos ' + PRON.meta.min_dias + ' días de dato. Las dos medidas no son equivalentes en magnitud.';
}

// ===== VISTA SUPUESTOS Y VERIFICACIÓN =====
function drawS(){
  var c = cfg(), cont = document.getElementById('sup'), rango = PRON.meta.analogos[0] + '–' + PRON.meta.analogos[1];
  SIM = simular();
  cont.innerHTML = '';
  var h = function(t){ cont.appendChild(nodo('h3', null, t)); };
  var p = function(t){ cont.appendChild(nodo('p', null, t)); };

  h('Cómo se calcula');
  p('Balance diario con paso mensual que arranca el ' + fCorta(I_INI) + ' ' + ANIO + ', desde el volumen CAR de ese día: V(día) = V(día anterior) + A / días del mes − Q × 0.0864, ' +
    'acotado entre 0 y el límite de vertimiento. A es la afluencia del mes (Mm³) y Q la descarga (m³/s).');
  var nd = PRON.meta.descartes[EMB];
  p(EMB === 'chuza'
    ? 'Afluencia: columna AFLUENCIA del reporte CAR. Es el residuo del balance (variación de volumen + descarga a planta + descarga de fondo), así que ya incluye la lluvia y la evaporación sobre el embalse. ' +
      'Se descartan, sin sustituirlos, los días en que no cuadra con la variación de volumen (descarga implícita fuera de −3 a 25 m³/s): ' + nd + ' días en la serie. ' +
      'El reporte no trae vertimiento, así que en los meses con el embalse lleno la afluencia registrada puede quedar por debajo de la real.'
    : 'Afluencia implícita: variación de volumen + descarga, calculada del reporte CAR. Incluye la lluvia y la evaporación sobre el embalse' +
      (EMB === 'tomine' ? ' y el bombeo desde el río Bogotá' : '') + '. ' +
      'Se descartan, sin sustituirlas, las descargas diarias mayores que tres veces el percentil 99 del embalse: ' + nd + ' días en la serie.');
  p('Cada año análogo aporta una trayectoria con sus afluencias de los meses que faltan del año; el mes de arranque entra sólo con los días restantes. La banda es el rango P10–P90 de esas trayectorias y la línea discontinua, su mediana. ' +
    'La señal IDEAM aplica la anomalía de escorrentía de la emisión de ' + etqMes(PRON.meta.emision) + ' a la afluencia media ' + rango + '. ' +
    'Lo observado desde el ' + fCorta(I_INI) + ' no entra al cálculo: sirve para verificar.');

  h('Parámetros · ' + c.nom);
  tabla(cont, ['Parámetro','Valor','Fuente'], [
    ['Volumen inicial, ' + fCorta(I_INI) + ' ' + ANIO, c.v0.toFixed(1) + ' Mm³ (' + (100*c.v0/c.cap).toFixed(1) + ' % útil)', 'Reporte diario CAR, hoja ' + c.hoja],
    ['Capacidad útil', c.cap.toFixed(1) + ' Mm³', c.cap_fuente],
    ['Límite de vertimiento', c.vmax.toFixed(1) + ' Mm³', 'Mayor valor entre la capacidad útil y el máximo observado en la serie CAR'],
    ['Años análogos', SIM.n + ': ' + SIM.anios.join(', '), 'Años ' + rango + ' con septiembre a diciembre completos']
  ], 'txt');
  var origen = EMB === 'chuza' ? MESES_P.map(function(){ return 'EAAB'; })
                               : MESES_P.map(function(m, i){ return i < c.desc.q.length ? 'Comité CAR' : 'Tibitoc − río'; });
  tabla(cont, ['Mes'].concat(MESES_P.map(function(m){ return MN[m]; })), [
    ['Descarga (m³/s)'].concat(SIM.q.map(function(v){ return v.toFixed(2); })),
    ['Origen'].concat(origen),
    ['Afluencia media ' + rango + ' (m³/s)'].concat(MESES_P.map(function(m){ return c.afl.media[m].toFixed(2); })),
    ['Anomalía IDEAM, emisión ' + etqMes(PRON.meta.emision)].concat(c.ideam.anom.map(function(v){ return signo(v) + ' %'; }))
  ]);
  if(EMB !== 'chuza'){
    var e = PRON.emb;
    p('En noviembre y diciembre la descarga conjunta de Tominé, Neusa y Sisga es el tratamiento proyectado en Tibitoc (' + PAR.tibitoc.toFixed(1) +
      ' m³/s) menos el aporte del río (' + PAR.rio.toFixed(1) + ' m³/s, bajo por El Niño), repartida en la proporción de octubre del comité: Tominé ' +
      (100*e.tomine.desc.cuota).toFixed(0) + ' %, Neusa ' + (100*e.neusa.desc.cuota).toFixed(0) + ' %, Sisga ' + (100*e.sisga.desc.cuota).toFixed(0) + ' %.');
  }

  h('Verificación histórica');
  var v = c.verif;
  p('Para cada año ' + rango + ' se proyectó el resto del año desde su ' + fCorta(I_INI) + ' con las afluencias de los demás años y la descarga que realmente se ejecutó (' +
    v.n + ' años). Esto mide la parte hidrológica: la descarga es un supuesto de operación y no se pronostica. Una banda P10–P90 bien calibrada contiene lo observado cerca del 80 % de las veces.');
  tabla(cont, ['Fin de mes'].concat(v.meses.map(function(m){ return MN[m-1]; })), [
    ['Error típico de la mediana (Mm³)'].concat(v.mae.map(function(x){ return x.toFixed(1); })),
    ['Error típico (% de la capacidad útil)'].concat(v.mae.map(function(x){ return (100*x/c.cap).toFixed(1) + ' %'; })),
    ['Observado dentro de P10–P90'].concat(v.cob.map(function(x){ return x + ' %'; }))
  ]);
  if(v.meses.length < MESES_P.length) p('El mes de arranque no aparece en la tabla: con tan pocos días de horizonte la banda es demasiado angosta para que su cobertura signifique algo.');
  if(EMB === 'tomine') p('Confiabilidad baja en Tominé: sus descargas se hacen a solicitud de GEB/Enlaza y recibe bombeo desde el río Bogotá, así que la banda contiene lo observado con menos frecuencia de la esperada.');

  if(c.comite){
    var cm = c.comite, f = cm.fecha_esc, kd = diaDeFecha(+f.slice(0,4), +f.slice(5,7), +f.slice(8,10)) - I_INI;
    h('Comparación con el comité hidrológico CAR (' + PRON.meta.fecha_comite + ')');
    p('El comité partió de ' + cm.v.toFixed(2) + ' Mm³ (' + cm.pct.toFixed(1) + ' % útil) con las descargas de su tabla y afluencias medias de ' +
      cm.afl.map(function(x, i){ return MNC[7+i] + ' ' + x.toFixed(2); }).join(', ') + ' m³/s. Esta proyección arranca el ' + fCorta(I_INI) + ' desde el volumen CAR de ese día, toma del comité las descargas de septiembre y octubre y usa el ensamble de años análogos.');
    var filas = cm.esc.map(function(s){ return ['Comité · afluencia ' + s[0], s[1].toFixed(2), (100*s[1]/c.cap).toFixed(1) + ' %']; });
    [['P10', SIM.p10], ['mediana', SIM.p50], ['P90', SIM.p90]].forEach(function(s){
      filas.push(['Este modelo · ' + s[0], s[1][kd].toFixed(2), (100*s[1][kd]/c.cap).toFixed(1) + ' %']);
    });
    tabla(cont, ['Volumen al ' + fCorta(I_INI + kd) + ' ' + ANIO, 'Mm³', '% útil'], filas);
    if(cm.nota) p(cm.nota);
  }

  h('Consideraciones');
  var ul = nodo('ul');
  [
    'La proyección es un escenario condicionado a las descargas indicadas: con otra operación el resultado cambia (controles de la vista Proyección).',
    'La señal IDEAM es escorrentía del modelo DWB y el IDEAM la entrega como señal de déficit o excedencia, no como magnitud. La vista Señal IDEAM compara sus emisiones con lo observado en ' + ANIO + '.',
    'Sólo información oficial: reportes diarios CAR, comité hidrológico CAR, EAAB e IDEAM. Los meses con menos de ' + PRON.meta.min_dias + ' días de dato quedan fuera del ensamble; nada se interpola ni se rellena.'
  ].forEach(function(t){ ul.appendChild(nodo('li', null, t)); });
  cont.appendChild(ul);
}

// ===== Navegación =====
function switchView(mode){
  VISTA = mode;
  ['P','F','I','S'].forEach(function(k){
    document.getElementById('view'+k).style.display = k === mode ? '' : 'none';
    document.getElementById('tab'+k).classList.toggle('active', k === mode);
  });
  CROSS = null; tt.style.display = 'none';
  if(mode === 'P' && !chartP) buildP();
  if(mode === 'F' && !chartF) drawF();
  if(mode === 'I' && !chartI) drawI();
  if(mode === 'S') drawS();
}

parDefecto();
crearSelector();
cargarEmbalse();
</script>
